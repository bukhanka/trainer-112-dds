name: lct-trainer

# Local development and single-host deployment.
#   docker compose up -d db                              — database only (for `pnpm dev`)
#   docker compose --profile app up -d                   — database + application on :3000
#   docker compose --profile app --profile https up -d   — plus HTTPS (Caddy), see deploy/Caddyfile
x-logging: &logging
  # Bounded logs: the stand runs unattended for weeks.
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:16-alpine
    logging: *logging
    restart: always
    environment:
      POSTGRES_USER: trainer
      POSTGRES_PASSWORD: trainer
      POSTGRES_DB: trainer
    ports:
      - "5442:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trainer -d trainer"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    profiles: ["app"]
    logging: *logging
    build: .
    image: trainer-112-dds:latest
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://trainer:trainer@db:5432/trainer?schema=public&connection_limit=15&pool_timeout=20
    ports:
      - "3000:3000"
    volumes:
      - backups:/backups

  caddy:
    profiles: ["https"]
    logging: *logging
    image: caddy:2-alpine
    restart: always
    depends_on:
      - app
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
      TLS_MODE: ${TLS_MODE:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data

volumes:
  db-data:
  backups:
  caddy-data:
