name: lct-trainer

# Local development and single-host deployment.
#   docker compose up -d db          — database only (for `pnpm dev`)
#   docker compose --profile app up  — database + application
services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: trainer
      POSTGRES_PASSWORD: trainer
      POSTGRES_DB: trainer
    ports:
      - "5442:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trainer -d trainer"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  db-data:
