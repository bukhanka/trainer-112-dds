name: lct-trainer

# Local development and single-host deployment.
#   docker compose up -d db                              — database only (for `pnpm dev`)
#   docker compose --profile app up -d                   — database + application on :3000
#   docker compose --profile app --profile https up -d   — plus HTTPS (Caddy), see deploy/Caddyfile
x-logging: &logging
  # Bounded logs: the stand runs unattended for weeks.
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:16-alpine
    logging: *logging
    restart: always
    environment:
      POSTGRES_USER: trainer
      # Set POSTGRES_PASSWORD in .env for a server; it is applied when the database volume is first created.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trainer}
      POSTGRES_DB: trainer
    ports:
      # Only this machine can reach the database (for `pnpm dev` and maintenance); never the network.
      - "127.0.0.1:5442:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trainer -d trainer"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    profiles: ["app"]
    logging: *logging
    build: .
    image: trainer-112-dds:latest
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://trainer:${POSTGRES_PASSWORD:-trainer}@db:5432/trainer?schema=public&connection_limit=15&pool_timeout=20
      # Google service-account key, mounted read-only below (GOOGLE_KEY_FILE on the host); unused without Google models.
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/google-sa.json
    ports:
      # Plain HTTP for a quick start. Behind HTTPS set APP_PUBLISH=127.0.0.1:3000 so that only Caddy is open.
      - "${APP_PUBLISH:-3000}:3000"
    volumes:
      - backups:/backups
      # Files of the library of materials; the backup job mirrors them into the backups volume.
      - materials:/materials
      - ${GOOGLE_KEY_FILE:-./deploy/no-google-key.json}:/run/secrets/google-sa.json:ro

  caddy:
    profiles: ["https"]
    logging: *logging
    image: caddy:2-alpine
    restart: always
    depends_on:
      - app
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
      TLS_MODE: ${TLS_MODE:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data

volumes:
  db-data:
  backups:
  materials:
  caddy-data:
